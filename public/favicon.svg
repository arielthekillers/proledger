<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="flow-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#pf-bg)" />

  <!-- Flow Dynamic Curve Behind -->
  <path d="M 10 46 C 22 52, 40 48, 54 36" stroke="url(#flow-trail)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Isometric Package / Cube -->
  <!-- Top Face -->
  <polygon points="32,15 48,24 32,33 16,24" fill="url(#cube-top)" />
  
  <!-- Left Face -->
  <polygon points="16,24 32,33 32,49 16,40" fill="url(#cube-left)" />
  
  <!-- Right Face -->
  <polygon points="32,33 48,24 48,40 32,49" fill="url(#cube-right)" />

  <!-- Tape / Seam across top -->
  <polygon points="30,16 34,18 34,32 30,30" fill="#6366F1" opacity="0.4" />
  
  <!-- Dynamic Speed Accent -->
  <circle cx="50" cy="20" r="2.5" fill="#38BDF8" />
</svg>
